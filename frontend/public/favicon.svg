<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="summit-bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="summit-left-slope" x1="10" y1="36" x2="24" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="summit-right-slope" x1="24" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle Frame -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#summit-bg-grad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Symmetrical Mountain Summit Peak (Left: Summit Blue / Right: Terracotta) -->
  <polygon points="24,11 10,36 24,36" fill="url(#summit-left-slope)" />
  <polygon points="24,11 24,36 38,36" fill="url(#summit-right-slope)" />
  
  <!-- Central Summit Ridge Line -->
  <line x1="24" y1="11" x2="24" y2="36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Snowcap Top Triangle -->
  <polygon points="24,11 19,20 24,18 29,20" fill="#FFFFFF" />
  
  <!-- High Altitude Star Spark -->
  <circle cx="24" cy="8" r="2.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
</svg>