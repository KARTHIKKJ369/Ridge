services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ridge-postgres
    environment:
      POSTGRES_DB: ridge
      POSTGRES_USER: ridge
      POSTGRES_PASSWORD: ridge
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  ridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridge-crag
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ridge:ridge@postgres:5432/ridge
      - DATABASE_URL_SYNC=postgresql://ridge:ridge@postgres:5432/ridge
      - RETRIEVAL_BACKEND=pgvector
      - EMBEDDING_MODEL=BAAI/bge-large-en-v1.5
      - EMBEDDING_DIMENSION=1024
    depends_on:
      - postgres

    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  pg_data:
  app_data:


