services:
  ridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridge-crag
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-groq/compound}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-groq/compound-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
