services:
  ridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridge-crag
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - app_data:/app/data
    restart: unless-stopped

volumes:
  chroma_data:
  app_data:
